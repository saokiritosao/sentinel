run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive

linters-settings:
  gosec:
    excludes:
      - G404 # math/rand is fine in the traffic simulator

issues:
  exclude-rules:
    - path: _test\.go
      linters: [gosec, errcheck]
