name: sentinel

x-app-env: &app-env
  LOG_LEVEL: info
  LOG_FORMAT: json
  KAFKA_BROKERS: kafka:9092
  REDIS_ADDR: redis:6379
  POSTGRES_DSN: postgres://sentinel:sentinel@postgres:5432/sentinel?sslmode=disable

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    # AOF чтобы окна правил переживали рестарт
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # kafka в KRaft режиме (без zookeeper): kafka:9092 для контейнеров, localhost:29092 для хоста
  kafka:
    image: apache/kafka:3.9.0
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # топики создаём сами, чтобы задать кол-во партиций
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        K=/opt/kafka/bin/kafka-topics.sh
        $$K --bootstrap-server kafka:9092 --create --if-not-exists --topic events.raw --partitions 6 --replication-factor 1 --config retention.ms=604800000
        $$K --bootstrap-server kafka:9092 --create --if-not-exists --topic events.dlq --partitions 1 --replication-factor 1 --config retention.ms=2592000000
        $$K --bootstrap-server kafka:9092 --list
    restart: "no"

  ingest:
    build: { context: ., args: { SERVICE: ingest } }
    environment:
      <<: *app-env
      INGEST_API_KEYS: simulator:dev-ingest-key-0123456789
    ports: ["8080:8080"]
    depends_on:
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  detector:
    build: { context: ., args: { SERVICE: detector } }
    environment: *app-env
    # две реплики в одной consumer group делят 6 партиций
    deploy:
      replicas: 2
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  api:
    build: { context: ., args: { SERVICE: api } }
    environment:
      <<: *app-env
      API_KEYS: analyst:dev-api-key-0123456789
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  simulator:
    build: { context: ., args: { SERVICE: simulator } }
    profiles: [demo]
    environment:
      SIM_INGEST_URL: http://ingest:8080
      SIM_API_KEY: dev-ingest-key-0123456789
    depends_on: [ingest]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: [tools]
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: sentinel
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [tools]
    ports: ["9090:9090"]
    volumes: [./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro]

volumes:
  pgdata:
