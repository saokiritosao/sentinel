openapi: 3.0.3
info:
  title: Sentinel
  version: 1.0.0
  description: Security event ingestion (port 8080) and alert API (port 8081).
servers:
  - url: http://localhost:8080
    description: ingest
  - url: http://localhost:8081
    description: api
security:
  - apiKey: []

paths:
  /v1/events:
    post:
      summary: Submit a batch of events (ingest)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              additionalProperties: false
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: "#/components/schemas/Event" }
      responses:
        "202":
          description: Durably written to Kafka
          content:
            application/json:
              schema: { type: object, properties: { accepted: { type: integer } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422":
          description: One or more events are invalid; nothing was accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Rate limited
          headers: { Retry-After: { schema: { type: integer } } }
        "503":
          description: Kafka unavailable, retry the whole batch
          headers: { Retry-After: { schema: { type: integer } } }

  /v1/alerts:
    get:
      summary: List alerts, newest first
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Status" } }
        - { name: severity, in: query, schema: { $ref: "#/components/schemas/Severity" } }
        - { name: rule, in: query, schema: { type: string, example: bruteforce } }
        - { name: entity, in: query, schema: { type: string, example: 203.0.113.7 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, description: next_cursor from the previous page, schema: { type: string } }
      responses:
        "200":
          description: A page of alerts
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Alert" } }
                  next_cursor: { type: string }
        "400": { $ref: "#/components/responses/Error" }

  /v1/alerts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: Get an alert with recent contributing events
      responses:
        "200":
          description: Alert
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Alert" }
                  - type: object
                    properties:
                      recent_events:
                        type: array
                        items:
                          type: object
                          properties:
                            event_id: { type: string, format: uuid }
                            occurred_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Change alert status (open → acknowledged → resolved)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/Status" }
      responses:
        "200":
          description: Updated alert
          content: { application/json: { schema: { $ref: "#/components/schemas/Alert" } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/stats:
    get:
      summary: Aggregated counts (cached for a few seconds)
      responses:
        "200":
          description: Stats
          headers: { X-Cache: { schema: { type: string, enum: [HIT, MISS] } } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  by_status: { type: object, additionalProperties: { type: integer } }
                  by_severity_active: { type: object, additionalProperties: { type: integer } }
                  top_active_entities:
                    type: array
                    items:
                      type: object
                      properties:
                        entity: { type: string }
                        rule: { type: string }
                        event_count: { type: integer }
                  generated_at: { type: string, format: date-time }

components:
  securitySchemes:
    apiKey: { type: apiKey, in: header, name: X-API-Key }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Event:
      type: object
      required: [event_id, type, outcome, user, src_ip, country, timestamp]
      properties:
        event_id: { type: string, format: uuid, description: Producer-generated; used for deduplication }
        type: { type: string, enum: [auth.login] }
        outcome: { type: string, enum: [success, failure] }
        user: { type: string, maxLength: 256 }
        src_ip: { type: string, example: 203.0.113.7 }
        country: { type: string, pattern: "^[A-Z]{2}$", example: NL }
        source: { type: string, maxLength: 64 }
        timestamp: { type: string, format: date-time }

    Severity: { type: string, enum: [low, medium, high, critical] }
    Status: { type: string, enum: [open, acknowledged, resolved] }

    Alert:
      type: object
      properties:
        id: { type: integer, format: int64 }
        rule: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        entity: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        event_count: { type: integer }
        details: { type: object }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
